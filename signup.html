<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nathan Vanderpool — Stay in touch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #f9f3e7;
      --cream-edge: #eaddc6;
      --coral: #cf6038;
      --coral-deep: #b24e2b;
      --ink: #2c2620;
      --ink-soft: #6b6154;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      background-color: var(--cream);
      color: var(--ink);
      font-family: "EB Garamond", Georgia, serif;
      font-size: 19px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 24px 72px;
    }

    /* Banner */
    .banner {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
      border-radius: 0 0 3px 3px;
    }

    .banner-frame {
      max-width: 820px;
      margin: 0 auto 8px;
    }

    /* Intro copy */
    .intro {
      text-align: center;
      padding: 44px 8px 34px;
    }

    .eyebrow {
      font-family: "EB Garamond", Georgia, serif;
      font-size: 15px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--coral);
      margin: 0 0 18px;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: clamp(34px, 6vw, 50px);
      line-height: 1.08;
      letter-spacing: 0.005em;
      margin: 0 0 20px;
    }

    .lede {
      max-width: 30em;
      margin: 0 auto;
      font-size: 21px;
      color: var(--ink);
    }

    .lede .quiet { color: var(--ink-soft); }

    /* Divider */
    .rule {
      width: 44px;
      height: 1px;
      background: var(--coral);
      border: 0;
      margin: 30px auto 0;
      opacity: 0.7;
    }

    /* Form embed */
    .form-card {
      margin-top: 34px;
      border: 1px solid var(--cream-edge);
      border-radius: 4px;
      background: #fffdf8;
      box-shadow: 0 10px 30px -18px rgba(44, 38, 32, 0.35);
      overflow: hidden;
    }

    .airtable-embed {
      display: block;
      width: 100%;
      height: 533px;
      background: transparent;
      border: 0;
    }

    /* Fallback link if the embed is blocked */
    .fallback {
      text-align: center;
      margin-top: 20px;
      font-size: 16px;
      color: var(--ink-soft);
    }

    .fallback a {
      color: var(--coral);
      text-decoration: none;
      border-bottom: 1px solid rgba(207, 96, 56, 0.35);
      padding-bottom: 1px;
    }

    .fallback a:hover { border-bottom-color: var(--coral); }

    @media (max-width: 520px) {
      body { font-size: 18px; }
      .intro { padding: 32px 4px 26px; }
      .lede { font-size: 19px; }
    }
  </style>
</head>
<body>
  <div class="banner-frame">
    <img class="banner" src="3_logos_nv.png" alt="Agapic Chants · Secret Chord Collective · Sacred Transitions — Nathan Vanderpool" />
  </div>

  <div class="wrap">
    <div class="form-card">
      <iframe
        class="airtable-embed"
        src="https://airtable.com/embed/appIhsyHzVsNDtbJG/pagSePJRCTdVUx2Lr/form"
        title="Sign up to stay in touch"
        frameborder="0"
        width="100%"
        height="533"
      ></iframe>
    </div>

    <p class="fallback">Form not loading? <a href="https://airtable.com/embed/appIhsyHzVsNDtbJG/pagSePJRCTdVUx2Lr/form" target="_blank" rel="noopener">Open it in a new tab →</a></p>
  </div>
</body>
</html>
